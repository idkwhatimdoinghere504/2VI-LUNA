name: Build 2VI AI Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle wrapper and build APK
        run: |
          WRAPPER="$(find . -type f -name gradlew -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::No gradlew script found in the repository."
            exit 1
          fi
          chmod +x "$WRAPPER"
          cd "$(dirname "$WRAPPER")"
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 2VI-AI-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
